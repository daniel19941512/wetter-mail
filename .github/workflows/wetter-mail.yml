name: Wetter-Mail

on:
  schedule:
    # Uhrzeiten in UTC! Aktuell Sommerzeit (CEST = UTC+2), daher:
    # 4:00 UTC  -> 6:00 Uhr deutsche Zeit
    # 16:00 UTC -> 18:00 Uhr deutsche Zeit
    # WICHTIG: Im Winter (CET = UTC+1) verschieben sich die deutschen Zeiten
    # dadurch um 1h nach hinten (z.B. 7:00 statt 6:00). Zur Zeitumstellung
    # (Ende Oktober / Ende März) hier die zwei Stunden-Werte um je 1
    # anpassen: Winterzeit -> "0 5", "0 17".
    - cron: "0 4 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch: {}  # erlaubt manuelles Auslösen über den "Run workflow" Button

jobs:
  send-weather-mail:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # nötig, damit der Workflow letzte_vorhersage.json zurück ins Repo committen darf
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Wetter-Mail versenden
        env:
          WETTER_ORT: ${{ secrets.WETTER_ORT }}
          GMAIL_ADRESSE: ${{ secrets.GMAIL_ADRESSE }}
          GMAIL_APP_PASSWORT: ${{ secrets.GMAIL_APP_PASSWORT }}
          WETTER_EMPFAENGER: ${{ secrets.WETTER_EMPFAENGER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python wetter_mail.py

      - name: Vorhersage-Historie speichern (für den Vergleich beim nächsten Lauf)
        run: |
          if [ -n "$(git status --porcelain letzte_vorhersage.json)" ]; then
            git config user.name "Wetter-Mail Bot"
            git config user.email "actions@github.com"
            git add letzte_vorhersage.json
            git commit -m "Vorhersage-Historie aktualisieren [skip ci]"
            git push
          else
            echo "Keine Änderung an der Vorhersage-Historie."
          fi
