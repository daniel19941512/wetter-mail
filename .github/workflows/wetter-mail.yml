name: Wetter-Mail

on:
  schedule:
    # Uhrzeiten in UTC! Aktuell Sommerzeit (CEST = UTC+2), daher:
    # 4:30 UTC  -> 6:30 Uhr deutsche Zeit
    # 10:30 UTC -> 12:30 Uhr deutsche Zeit
    # 16:30 UTC -> 18:30 Uhr deutsche Zeit
    # WICHTIG: Im Winter (CET = UTC+1) verschieben sich die deutschen Zeiten
    # dadurch um 1h nach hinten (z.B. 7:30 statt 6:30). Zur Zeitumstellung
    # (Ende Oktober / Ende März) hier die drei Stunden-Werte um je 1
    # anpassen: Winterzeit -> "30 5", "30 11", "30 17".
    - cron: "30 4 * * *"
    - cron: "30 10 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch: {}  # erlaubt manuelles Auslösen über den "Run workflow" Button

jobs:
  send-weather-mail:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Wetter-Mail versenden
        env:
          WETTER_ORT: ${{ secrets.WETTER_ORT }}
          GMAIL_ADRESSE: ${{ secrets.GMAIL_ADRESSE }}
          GMAIL_APP_PASSWORT: ${{ secrets.GMAIL_APP_PASSWORT }}
          WETTER_EMPFAENGER: ${{ secrets.WETTER_EMPFAENGER }}
        run: python wetter_mail.py
